name: Bootstrap source
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          cat > /tmp/source.b64 <<'ARCHIVE'
          
          
          
          
          
          
          
          
          ARCHIVE
          base64 -d /tmp/source.b64 > /tmp/ipb-source.tar.gz
          tar -xzf /tmp/ipb-source.tar.gz
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add IPB Course Companion Android source'
          git push
